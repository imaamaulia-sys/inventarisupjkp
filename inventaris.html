<body>
<div id="app">

<script>

// ─── FIREBASE ────────────────────────────────────────────────
let db = null;
let _fbUnsub = null;
let _fbStatus = 'loading'; // 'loading' | 'ok' | 'error' | 'noconfig'

function loadConfig(){
  try{const r=localStorage.getItem('fb_cfg');if(r)return JSON.parse(r);}catch{}
  return null;
}
function saveConfig(cfg){
  try{localStorage.setItem('fb_cfg',JSON.stringify(cfg));}catch{}
}

function initFirebase(cfg){
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    db = firebase.firestore();
    _fbStatus='ok';
    // Real-time listener — data otomatis sinkron ke semua browser
    if(_fbUnsub) _fbUnsub();
    _fbUnsub = db.collection('inventaris').doc('data').onSnapshot(doc=>{
      if(doc.exists()){
        const d=doc.data();
        S.consumables=d.consumables||INIT.consumables;
        S.txs=d.txs||INIT.txs;
        S.tools=d.tools||INIT.tools;
        S.loans=d.loans||INIT.loans;
        S.assets=d.assets||INIT.assets;
        S.maint=d.maint||INIT.maint;
      }else{
        Object.assign(S,{consumables:INIT.consumables,txs:INIT.txs,tools:INIT.tools,loans:INIT.loans,assets:INIT.assets,maint:INIT.maint});
        saveStorage(); // inisialisasi dokumen pertama kali
      }
      render();
    }, err=>{
      console.error('Firestore:',err);
      _fbStatus='error';
      render();
    });
    return true;
  }catch(e){
    console.error('Firebase init:',e);
    _fbStatus='error';
    return false;
  }
}

// ─── STATE ───────────────────────────────────────────────────
const INIT = {

    {id:'c4',name:'Amplop Surat',unit:'Kotak',stock:8,minStock:5,category:'ATK',desc:''},
    {id:'c5',name:'Spidol Whiteboard',unit:'Kotak',stock:2,minStock:4,category:'ATK',desc:''},
  ],
  txs:[

    {id:'t2',type:'out',itemId:'c1',itemName:'Kertas HVS A4',qty:5,date:'2025-05-10',by:'Budi Santoso',purpose:'Cetak Laporan',dept:'Sekretariat',notes:''},
    {id:'t3',type:'out',itemId:'c3',itemName:'Pena Ballpoint',qty:2,date:'2025-05-12',by:'Siti Rahayu',purpose:'Keperluan Rapat',dept:'Umum',notes:''},
  ],

    {id:'lt2',name:'Timbangan Digital',code:'TBG-001',unit:'Unit',qty:5,available:4,condition:'Baik',category:'Alat Ukur',desc:''},
    {id:'lt3',name:'GPS Handheld',code:'GPS-001',unit:'Unit',qty:2,available:2,condition:'Baik',category:'Alat Ukur',desc:''},

  ],
  loans:[
    {id:'l1',toolId:'lt1',toolName:'Bor Tanah',code:'BOR-001',borrower:'Ahmad Fauzi',dept:'Tim Lapangan A',phone:'081234567890',date:'2025-05-15',dueDate:'2025-05-22',qty:1,purpose:'Survey Tanah Kec. Ciledug',conditionOut:'Baik',status:'active',returnDate:null,conditionIn:null,returnNotes:'',notes:''},
  ],
  assets:[
    {id:'a1',name:'Meja Kerja Oak',code:'FRN-001',category:'Furnitur',purchaseDate:'2022-01-15',purchasePrice:2500000,lifespan:10,condition:'Baik',location:'Ruang Kerja',serial:'MBL-2022-001',status:'Aktif',desc:''},
    {id:'a2',name:'Monitor LED 24"',code:'ELK-001',category:'Elektronik',purchaseDate:'2023-03-20',purchasePrice:3200000,lifespan:5,condition:'Baik',location:'Ruang Kerja',serial:'MON-2023-024',status:'Aktif',desc:''},
    {id:'a3',name:'Kursi Ergonomis',code:'FRN-002',category:'Furnitur',purchaseDate:'2022-06-10',purchasePrice:1800000,lifespan:8,condition:'Cukup',location:'Ruang Kepala',serial:'KRS-2022-003',status:'Aktif',desc:''},

let S = {
  page:'dashboard', tab:{consumables:'items',longterm:'tools',assets:'list'},
  confirmPending:null,
  modal:null, form:{}, selId:null, search:'', assetFilter:'all', setupErr:'',
  consumables:[], txs:[], tools:[], loans:[], assets:[], maint:[]
};

// ─── HELPERS ─────────────────────────────────────────────────
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tod=()=>new Date().toISOString().split('T')[0];
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'–';
const fmtRp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const calcDep=a=>{
  if(!a.purchaseDate||!a.purchasePrice||!a.lifespan)return null;
  const yrs=(Date.now()-new Date(a.purchaseDate).getTime())/(365.25*24*3600*1000);
  const ann=a.purchasePrice/a.lifespan;
  const acc=Math.min(ann*yrs,a.purchasePrice);
  const bv=Math.max(a.purchasePrice-acc,0);
  const pct=Math.min((yrs/a.lifespan)*100,100);
  return{annual:ann,accumulated:acc,bookValue:bv,pct,years:yrs};
};

const condBadge=c=>{
  if(c==='Baik')return'<span class="badge badge-green">'+esc(c)+'</span>';
  if(c==='Cukup')return'<span class="badge badge-amber">'+esc(c)+'</span>';
  if(c==='Perlu Perbaikan')return'<span class="badge badge-red">'+esc(c)+'</span>';
  if(c==='Rusak')return'<span class="badge badge-gray">'+esc(c)+'</span>';
  return'<span class="badge badge-indigo">'+esc(c)+'</span>';
};
const statBadge=s=>{
  if(s==='Aktif')return'<span class="badge badge-green">'+esc(s)+'</span>';
  if(s==='Dalam Perbaikan')return'<span class="badge badge-amber">'+esc(s)+'</span>';
  if(s==='Disposal'||s==='Hilang')return'<span class="badge badge-red">'+esc(s)+'</span>';
  return'<span class="badge badge-gray">'+esc(s)+'</span>';
};

// ─── STORAGE ─────────────────────────────────────────────────
function saveStorage(){
  if(!db) return;
  const data={consumables:S.consumables,txs:S.txs,tools:S.tools,loans:S.loans,assets:S.assets,maint:S.maint};
  db.collection('inventaris').doc('data').set(data).catch(e=>console.error('Save:',e));
}

// ─── PRINT ───────────────────────────────────────────────────

// ─── RENDER HELPERS ──────────────────────────────────────────
function emptyState(){return'<div class="empty-state"><div class="emoji">📦</div><p>Belum ada data</p></div>';}

function statCard(label,val,icon,color,page){
  const style=color?'color:'+color+';':'';
  const click=page?'data-nav="'+page+'"':'';
  return'<div class="stat-card" '+click+' style="'+(page?'cursor:pointer':'')+'">'
    +'<div class="stat-top"><span class="stat-label">'+label+'</span><span class="stat-icon">'+icon+'</span></div>'
    +'<div class="stat-value" style="'+style+'">'+val+'</div>'
    +'</div>';
}

function progressBar(pct,color){
  return'<div class="progress-bg"><div class="progress-bar" style="width:'+Math.min(pct,100)+'%;background:'+color+'"></div></div>';
}

function stockStatus(stock,minStock){
  const pct=Math.min((stock/Math.max(minStock*3,1))*100,100);
  const color=stock===0?'#EF4444':stock<minStock?'#F59E0B':'#10B981';
  const label=stock===0?'HABIS':stock<minStock?'RENDAH':'Normal';
  return progressBar(pct,color)+'<div style="font-size:11px;color:'+color+';margin-top:3px;font-weight:600">'+label+'</div>';
}

// ─── DASHBOARD ───────────────────────────────────────────────
function renderDashboard(){
  const lowStock=S.consumables.filter(c=>c.stock<c.minStock).length;
  const activeLoans=S.loans.filter(l=>l.status==='active').length;
  const overdueLoans=S.loans.filter(l=>l.status==='active'&&new Date(l.dueDate)<new Date());
  const totalAssetVal=S.assets.reduce((s,a)=>s+(a.purchasePrice||0),0);
  const bookVal=S.assets.reduce((s,a)=>{const d=calcDep(a);return s+(d?d.bookValue:0);},0);
  const recentTxs=[...S.txs].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);

  let alerts='';
  if(lowStock>0)alerts+='<div class="alert alert-amber"><span>⚠️</span><span><strong>'+lowStock+' item</strong> stok di bawah minimum</span><button class="alert-btn" data-nav="consumables" style="background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#FCD34D">Lihat →</button></div>';
  if(overdueLoans.length>0)alerts+='<div class="alert alert-red"><span>🚨</span><span><strong>'+overdueLoans.length+' peminjaman</strong> melewati batas pengembalian</span><button class="alert-btn" data-nav="longterm" style="background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);color:#FCA5A5">Lihat →</button></div>';
  if(alerts)alerts='<div style="margin-bottom:24px">'+alerts+'</div>';

  let statGrid='<div class="stat-grid">'
    +statCard('Jenis Alat Habis Pakai',S.consumables.length,'📦','#6366F1','consumables')
    +statCard('Peminjaman Aktif',activeLoans,'🔧','#3B82F6','longterm')
    +statCard('Total Aset Investasi',S.assets.length,'🏷️','#10B981','assets')
    +statCard('Nilai Buku Aset',fmtRp(bookVal),'💰','#F59E0B','')
    +'</div>';

  // Low stock list
  const lowItems=S.consumables.filter(c=>c.stock<c.minStock*2).slice(0,5);
  let lowList=lowItems.length===0?'<p style="color:#64748B;font-size:13px">Semua stok dalam kondisi aman ✓</p>'
    :lowItems.map(c=>'<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)">'
      +'<div><div style="font-size:14px;font-weight:500">'+esc(c.name)+'</div><div style="font-size:12px;color:#64748B">'+esc(c.unit)+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:18px;font-weight:700;color:'+(c.stock===0?'#EF4444':c.stock<c.minStock?'#F59E0B':'#10B981')+'">'+c.stock+'</div>'
      +'<div style="font-size:11px;color:#64748B">min: '+c.minStock+'</div></div></div>').join('');

  // Active loans list
  const actLoans=S.loans.filter(l=>l.status==='active').slice(0,4);
  let loanList=actLoans.length===0?'<p style="color:#64748B;font-size:13px">Tidak ada peminjaman aktif</p>'
    :actLoans.map(l=>{const ov=new Date(l.dueDate)<new Date();
      return'<div style="padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        +'<div><div style="font-size:14px;font-weight:500">'+esc(l.toolName)+' <span style="color:#64748B;font-size:12px">×'+l.qty+'</span></div>'
        +'<div style="font-size:12px;color:#64748B">'+esc(l.borrower)+'</div></div>'
        +(ov?'<span class="badge badge-red">TERLAMBAT</span>':'<span class="badge badge-blue">Aktif</span>')
        +'</div><div style="font-size:11px;color:'+(ov?'#EF4444':'#64748B')+';margin-top:3px">Batas: '+fmtDate(l.dueDate)+'</div></div>';}).join('');

  // Recent txs table
  let txRows=recentTxs.map(t=>{
    const unit=S.consumables.find(c=>c.id===t.itemId);
    return'<tr><td class="muted nowrap">'+fmtDate(t.date)+'</td>'
      +'<td>'+(t.type==='in'?'<span class="badge badge-green">▲ Masuk</span>':'<span class="badge badge-red">▼ Keluar</span>')+'</td>'
      +'<td>'+esc(t.itemName)+'</td>'
      +'<td><strong>'+t.qty+'</strong>'+(unit?' '+esc(unit.unit):'')+'</td>'
      +'<td class="muted">'+esc(t.by||'')+(t.purpose?' — '+esc(t.purpose):'')+'</td>'
      +'</tr>';}).join('');
  let txTable=recentTxs.length===0?'<p style="color:#64748B;font-size:13px">Belum ada transaksi</p>'
    :'<div class="overflowx"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Barang</th><th>Jumlah</th><th>Oleh / Tujuan</th></tr></thead><tbody>'+txRows+'</tbody></table></div>';

  return '<div class="page">'
    +'<div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-sub">Ringkasan inventaris seluruh alat</div></div></div>'
    +alerts+statGrid
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">'
    +'<div class="card card-pad"><div style="font-size:14px;font-weight:700;margin-bottom:16px">⚠️ Stok Perlu Perhatian</div>'+lowList+'</div>'
    +'<div class="card card-pad"><div style="font-size:14px;font-weight:700;margin-bottom:16px">🔧 Peminjaman Aktif</div>'+loanList+'</div>'
    +'</div>'
    +'<div class="card card-pad"><div style="font-size:14px;font-weight:700;margin-bottom:16px">📝 Transaksi Terakhir</div>'+txTable+'</div>'
    +'</div>';
}

function renderConsumables(){

  let alerts='';
  const lowItems=S.consumables.filter(c=>c.stock<c.minStock);
  if(lowItems.length>0)alerts='<div class="alert alert-amber" style="margin-bottom:20px">⚠️ <strong>'+lowItems.length+' item</strong> perlu restok: '+lowItems.map(c=>esc(c.name)).join(', ')+'</div>';

  const tabs='<div class="tabs">'
    +'<button class="tab-btn '+(tab==='items'?'active':'')+'" data-tab="consumables:items">📦 Daftar Barang</button>'
    +'<button class="tab-btn '+(tab==='history'?'active':'')+'" data-tab="consumables:history">📝 Riwayat</button>'
    +'</div>';

  let content='';
  if(tab==='items'){
    const q=S.search.toLowerCase();
    const items=S.consumables.filter(c=>c.name.toLowerCase().includes(q));
    const rows=items.map(c=>'<tr>'
      +'<td><div style="font-weight:600">'+esc(c.name)+'</div>'+(c.desc?'<div style="font-size:12px;color:#64748B">'+esc(c.desc)+'</div>':'')+'</td>'

      +'<td class="muted nowrap">'+fmtDate(t.date)+'</td>'

      +'<td>'+esc(t.itemName)+'</td>'

      +'<td>'+esc(t.by||'–')+'</td>'
      +'<td class="muted">'+esc(t.dept||'–')+'</td>'
      +'<td class="muted">'+esc(t.purpose||'–')+'</td>'
      +'<td class="muted">'+esc(t.notes||'–')+'</td>'
      +'</tr>').join('');
    content='<div class="card">'+(txs.length===0?emptyState():'<div class="overflowx"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Barang</th><th>Jml</th><th>Oleh</th><th>Bagian</th><th>Tujuan</th><th>Catatan</th></tr></thead><tbody>'+rows+'</tbody></table></div>')+'</div>';
  }

  return'<div class="page">'
    +'<div class="page-header"><div><div class="page-title">Alat Habis Pakai</div><div class="page-sub">Manajemen stok barang habis pakai</div></div>'

    +alerts+tabs+content+'</div>';

// ─── ASSETS ──────────────────────────────────────────────────
function renderAssets(){
  const tab=S.tab.assets||'list';
  const totalVal=S.assets.reduce((s,a)=>s+(a.purchasePrice||0),0);
  const bookVal=S.assets.reduce((s,a)=>{const d=calcDep(a);return s+(d?d.bookValue:0);},0);
  const tabs='<div class="tabs">'
    +'<button class="tab-btn '+(tab==='list'?'active':'')+'" data-tab="assets:list">📋 Daftar Aset</button>'
    +'<button class="tab-btn '+(tab==='dep'?'active':'')+'" data-tab="assets:dep">📉 Penyusutan</button>'
    +'<button class="tab-btn '+(tab==='maint'?'active':'')+'" data-tab="assets:maint">🔨 Pemeliharaan</button>'
    +'</div>';

  const statGrid='<div class="stat-grid">'
    +statCard('Total Aset',S.assets.length,'🏷️','','')
    +statCard('Nilai Perolehan',fmtRp(totalVal),'💰','#6366F1','')
    +statCard('Nilai Buku',fmtRp(bookVal),'📊','#10B981','')
    +statCard('Total Penyusutan',fmtRp(totalVal-bookVal),'📉','#F59E0B','')
    +'</div>';

  const concept='<div class="concept-box">'
    +'<div class="concept-title">💡 Konsep Alat Investasi</div>'
    +'<div class="concept-body">Alat investasi adalah aset tetap jangka panjang (meja, monitor, lemari, dll). Sistem mencatat: <strong style="color:#F1F5F9">harga perolehan & masa manfaat</strong> → penyusutan otomatis (metode garis lurus), <strong style="color:#F1F5F9">kondisi & lokasi</strong> → pemantauan fisik, <strong style="color:#F1F5F9">riwayat pemeliharaan</strong>, dan <strong style="color:#F1F5F9">status</strong> → Aktif / Dalam Perbaikan / Disposal / Hilang.</div>'
    +'</div>';

  let content='';
  if(tab==='list'){
    const filter=S.assetFilter||'all';
    const items=filter==='all'?S.assets:S.assets.filter(a=>a.status===filter);
    const filterBtns=['all','Aktif','Dalam Perbaikan','Disposal','Hilang'].map(f=>
      '<button class="filter-btn '+(filter===f?'active':'')+'" data-assetfilter="'+f+'">'+(f==='all'?'Semua':f)+'</button>').join('');
    const rows=items.map(a=>{const dep=calcDep(a);
      return'<tr>'
        +'<td class="muted nowrap"><span class="mono">'+esc(a.code||'–')+'</span></td>'
        +'<td><div style="font-weight:600">'+esc(a.name)+'</div><div style="font-size:12px;color:#64748B">S/N: '+esc(a.serial||'–')+'</div></td>'
        +'<td class="muted">'+esc(a.category)+'</td>'
        +'<td class="muted">'+esc(a.location||'–')+'</td>'
        +'<td>'+condBadge(a.condition)+'</td>'
        +'<td>'+statBadge(a.status)+'</td>'
        +'<td><div style="font-weight:700">'+(dep?fmtRp(dep.bookValue):fmtRp(a.purchasePrice))+'</div>'+(dep?'<div style="font-size:11px;color:#64748B">'+dep.pct.toFixed(0)+'% terdepresiasi</div>':'')+'</td>'
        +'<td class="nowrap"><div class="actions">'
        +'<button class="btn btn-ghost btn-sm" data-action="openEditAsset" data-id="'+a.id+'">✏️</button>'
        +'<button class="btn btn-amber btn-sm" data-action="openAddMaint" data-id="'+a.id+'">🔨</button>'
        +'<button class="btn btn-danger btn-sm" data-action="deleteAsset" data-id="'+a.id+'">🗑</button>'
        +'</div></td>'
        +'</tr>';}).join('');
    content='<div class="card"><div class="filter-bar"><span style="font-size:13px;color:#64748B">Filter:</span>'+filterBtns+'</div>'
      +(items.length===0?emptyState():'<div class="overflowx"><table><thead><tr><th>Kode</th><th>Nama Aset</th><th>Kategori</th><th>Lokasi</th><th>Kondisi</th><th>Status</th><th>Nilai Buku</th><th>Aksi</th></tr></thead><tbody>'+rows+'</tbody></table></div>')
      +'</div>';
  }else if(tab==='dep'){
    content=S.assets.map(a=>{const dep=calcDep(a);if(!dep)return'';
      const bc=dep.pct>=90?'#EF4444':dep.pct>=60?'#F59E0B':'#10B981';
      return'<div class="dep-card">'
        +'<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">'
        +'<div><div style="font-weight:700;font-size:15px">'+esc(a.name)+'</div><div style="font-size:13px;color:#64748B">'+esc(a.code||'')+(a.category?' — '+esc(a.category):'')+(a.location?' — '+esc(a.location):'')+'</div></div>'
        +statBadge(a.status)+'</div>'
        +'<div class="dep-grid">'
        +'<div class="dep-cell"><div class="dep-cell-label">Harga Perolehan</div><div class="dep-cell-val" style="color:#F1F5F9">'+fmtRp(a.purchasePrice)+'</div></div>'
        +'<div class="dep-cell"><div class="dep-cell-label">Penyusutan/Tahun</div><div class="dep-cell-val" style="color:#F59E0B">'+fmtRp(dep.annual)+'</div></div>'
        +'<div class="dep-cell"><div class="dep-cell-label">Akumulasi Penyusutan</div><div class="dep-cell-val" style="color:#EF4444">'+fmtRp(dep.accumulated)+'</div></div>'
        +'<div class="dep-cell"><div class="dep-cell-label">Nilai Buku Saat Ini</div><div class="dep-cell-val" style="color:#10B981">'+fmtRp(dep.bookValue)+'</div></div>'
        +'</div>'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;color:#64748B;margin-bottom:6px">'
        +'<span>Masa Pakai: '+dep.years.toFixed(1)+' thn dari '+a.lifespan+' thn</span>'
        +'<span style="color:'+bc+';font-weight:700">'+dep.pct.toFixed(1)+'% terdepresiasi</span></div>'
        +progressBar(dep.pct,bc)
        +'<div style="font-size:12px;color:#64748B;margin-top:8px">Tgl. Perolehan: '+fmtDate(a.purchaseDate)+' | Akhir Masa Manfaat: '+fmtDate(new Date(new Date(a.purchaseDate).setFullYear(new Date(a.purchaseDate).getFullYear()+a.lifespan)).toISOString().split('T')[0])+'</div>'
        +'</div>';}).join('');
  }else{
    const totalMaint=S.maint.reduce((s,m)=>s+(m.cost||0),0);
    const rows=[...S.maint].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(m=>'<tr>'
      +'<td class="muted nowrap">'+fmtDate(m.date)+'</td>'
      +'<td><div style="font-weight:500">'+esc(m.assetName)+'</div></td>'
      +'<td>'+(m.type==='Perbaikan'?'<span class="badge badge-red">'+esc(m.type)+'</span>':'<span class="badge badge-indigo">'+esc(m.type)+'</span>')+'</td>'
      +'<td class="muted">'+esc(m.tech||'–')+'</td>'
      +'<td><span style="font-weight:700;color:#F59E0B">'+fmtRp(m.cost)+'</span></td>'
      +'<td class="muted">'+esc(m.desc)+'</td>'
      +'</tr>').join('');
    content='<div class="card"><div class="filter-bar" style="justify-content:space-between"><div style="font-size:14px;font-weight:700">Riwayat Pemeliharaan</div><div style="font-size:13px;color:#64748B">Total biaya: <strong style="color:#F59E0B">'+fmtRp(totalMaint)+'</strong></div></div>'
      +(S.maint.length===0?emptyState():'<div class="overflowx"><table><thead><tr><th>Tanggal</th><th>Aset</th><th>Jenis</th><th>Teknisi</th><th>Biaya</th><th>Keterangan</th></tr></thead><tbody>'+rows+'</tbody></table></div>')
      +'</div>';
  }

  return'<div class="page">'
    +'<div class="page-header"><div><div class="page-title">Alat Investasi</div><div class="page-sub">Aset jangka panjang dengan penyusutan & pemeliharaan</div></div>'
    +'<div class="header-actions"><button class="btn btn-primary" data-action="openAddAsset">+ Tambah Aset</button></div></div>'
    +statGrid+concept+tabs+content+'</div>';
}

// ─── MAIN RENDER ─────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  let pageHtml='';
  if(S.page==='setup')pageHtml=renderSetup(S.setupErr||'');
  else if(S.page==='dashboard')pageHtml=renderDashboard();
  else if(S.page==='consumables')pageHtml=renderConsumables();
  else if(S.page==='longterm')pageHtml=renderLongTerm();
  else if(S.page==='assets')pageHtml=renderAssets();

  if(S.page==='setup'){
    app.innerHTML=pageHtml;
  }else{
    app.innerHTML=renderSidebar()+'<main id="main-content">'+pageHtml+'</main>'+renderModal()+renderConfirm();
  }

  // Re-attach search listener
  const si=document.getElementById('search-inp');
  if(si)si.addEventListener('input',e=>{S.search=e.target.value;render();});

  // Scroll to top on page change
  const mc=document.getElementById('main-content');
  if(mc)mc.scrollTop=0;
}

// ─── EVENT HANDLING ───────────────────────────────────────────
function getF(){
  const get=id=>{const el=document.getElementById(id);return el?el.value:undefined;};
  return{name:get('f_name'),unit:get('f_unit'),stock:get('f_stock'),minStock:get('f_minStock'),
    category:get('f_category'),desc:get('f_desc'),qty:get('f_qty'),date:get('f_date'),
    by:get('f_by'),purpose:get('f_purpose'),dept:get('f_dept'),notes:get('f_notes'),
    ref:get('f_ref'),itemId:get('f_itemId'),
    borrower:get('f_borrower'),phone:get('f_phone'),toolId:get('f_toolId'),
    dueDate:get('f_dueDate'),conditionOut:get('f_conditionOut'),
    returnDate:get('f_returnDate'),conditionIn:get('f_conditionIn'),returnNotes:get('f_returnNotes'),
    code:get('f_code'),condition:get('f_condition'),status:get('f_status'),
    purchaseDate:get('f_purchaseDate'),purchasePrice:get('f_purchasePrice'),
    lifespan:get('f_lifespan'),location:get('f_location'),serial:get('f_serial'),
    cost:get('f_cost'),tech:get('f_tech'),type:get('f_type'),
  };
}

document.addEventListener('click',e=>{
  // Nav buttons
  const nav=e.target.closest('[data-nav]');
  if(nav){S.page=nav.dataset.nav;S.search='';S.modal=null;render();return;}

  // Tab buttons
  const tab=e.target.closest('[data-tab]');
  if(tab){const[p,t]=tab.dataset.tab.split(':');S.tab[p]=t;render();return;}

  // Filter buttons
  const af=e.target.closest('[data-assetfilter]');
  if(af){S.assetFilter=af.dataset.assetfilter;render();return;}

  // Actions
  const act=e.target.closest('[data-action]');
  if(!act)return;
  const action=act.dataset.action;
  const id=act.dataset.id;

  if(action==='openSetup'){const prevPage=S.page;S.page='setup';S.setupErr='';render();return;}
  if(action==='connectFirebase'){
    const apiKey=document.getElementById('fb_apiKey')?.value?.trim();
    const projectId=document.getElementById('fb_projectId')?.value?.trim();
    const appId=document.getElementById('fb_appId')?.value?.trim();
    const authDomain=document.getElementById('fb_authDomain')?.value?.trim()||projectId+'.firebaseapp.com';
    if(!apiKey||!projectId||!appId){S.setupErr='API Key, Project ID, dan App ID wajib diisi';render();return;}
    const cfg={apiKey,authDomain,projectId,appId};
    saveConfig(cfg);
    _fbStatus='loading';
    S.page='dashboard';
    const ok=initFirebase(cfg);
    if(!ok){_fbStatus='error';S.page='setup';S.setupErr='Gagal terhubung. Periksa konfigurasi Firebase Anda.';}
    render();return;
  }
  if(action==='closeModal'){S.modal=null;S.form={};S.selId=null;render();return;}
  if(action==='openAddConsumable'){S.modal='addConsumable';S.form={};render();return;}
  if(action==='openTakeOut'){S.modal='takeOut';S.form={date:tod()};render();return;}
  if(action==='stockIn'){S.modal='stockIn';S.selId=id;S.form={date:tod()};render();return;}
  if(action==='openAddTool'){S.modal='addTool';S.form={condition:'Baik',qty:1};render();return;}
  if(action==='openLoanForm'){S.modal='loanForm';S.form={date:tod(),conditionOut:'Baik'};render();return;}
  if(action==='openLoan'){S.modal='loanForm';S.form={toolId:id,date:tod(),conditionOut:'Baik',qty:1};render();return;}
  if(action==='openReturn'){S.modal='returnForm';S.selId=id;S.form={returnDate:tod(),conditionIn:'Baik'};render();return;}
  if(action==='openAddAsset'){S.modal='addAsset';S.form={condition:'Baik',status:'Aktif',lifespan:5,category:'Furnitur'};render();return;}
  if(action==='openEditAsset'){S.modal='editAsset';S.selId=id;S.form={};render();return;}
  if(action==='openAddMaint'){S.modal='addMaint';S.selId=id;S.form={date:tod()};render();return;}

  if(action==='printLoan'){const l=S.loans.find(x=>x.id===id);if(l)printLoan(l);return;}
  if(action==='printReturn'){const l=S.loans.find(x=>x.id===id);if(l)printReturn(l);return;}

  if(action==='deleteConsumable'){S.confirmPending={act:'doDeleteConsumable',id};render();return;}
  if(action==='deleteTool'){S.confirmPending={act:'doDeleteTool',id};render();return;}
  if(action==='deleteAsset'){S.confirmPending={act:'doDeleteAsset',id};render();return;}

  if(action==='saveConsumable'){
    const f=getF();
    if(!f.name||!f.unit){alert('Nama dan satuan wajib diisi');return;}
    const item={id:uid(),name:f.name,unit:f.unit,stock:Number(f.stock)||0,minStock:Number(f.minStock)||5,category:f.category||'ATK',desc:f.desc||''};
    S.consumables.push(item);
    if(Number(f.stock)>0)S.txs.push({id:uid(),type:'in',itemId:item.id,itemName:item.name,qty:Number(f.stock),date:tod(),by:'Admin',purpose:'Stok Awal',dept:'',notes:''});
    S.modal=null;S.form={};saveStorage();render();return;
  }

  if(action==='saveStockIn'){
    const f=getF();
    if(!f.qty||Number(f.qty)<=0){alert('Jumlah tidak valid');return;}
    S.consumables=S.consumables.map(c=>c.id===S.selId?{...c,stock:c.stock+Number(f.qty)}:c);
    const item=S.consumables.find(c=>c.id===S.selId);
    S.txs.push({id:uid(),type:'in',itemId:S.selId,itemName:item?.name||'',qty:Number(f.qty),date:f.date||tod(),by:f.by||'Admin',purpose:f.purpose||'Pengadaan',dept:'',notes:f.notes||''});
    S.modal=null;S.form={};S.selId=null;saveStorage();render();return;
  }

  if(action==='saveTakeOut'){
    const f=getF();
    const item=S.consumables.find(c=>c.id===f.itemId);
    if(!item){alert('Pilih barang terlebih dahulu');return;}
    if(!f.qty||Number(f.qty)<=0||Number(f.qty)>item.stock){alert('Jumlah tidak valid atau melebihi stok ('+item.stock+')');return;}
    if(!f.by){alert('Nama pengambil wajib diisi');return;}
    if(!f.purpose){alert('Tujuan penggunaan wajib diisi');return;}
    S.consumables=S.consumables.map(c=>c.id===item.id?{...c,stock:c.stock-Number(f.qty)}:c);
    S.txs.push({id:uid(),type:'out',itemId:item.id,itemName:item.name,qty:Number(f.qty),date:f.date||tod(),by:f.by,purpose:f.purpose,dept:f.dept||'',notes:f.notes||''});
    S.modal=null;S.form={};saveStorage();render();return;
  }

  if(action==='saveTool'){
    const f=getF();
    if(!f.name){alert('Nama alat wajib diisi');return;}
    const q=Number(f.qty)||1;
    S.tools.push({id:uid(),name:f.name,code:f.code||'',unit:f.unit||'Unit',qty:q,available:q,condition:f.condition||'Baik',category:f.category||'Alat Lapangan',desc:f.desc||''});
    S.modal=null;S.form={};saveStorage();render();return;
  }

  if(action==='confirmCancel'){S.confirmPending=null;render();return;}
  if(action==='doDeleteConsumable'){const xid=S.confirmPending?.id;S.confirmPending=null;if(xid){S.consumables=S.consumables.filter(c=>c.id!==xid);saveStorage();}render();return;}
  if(action==='doDeleteTool'){const xid=S.confirmPending?.id;S.confirmPending=null;if(xid){S.tools=S.tools.filter(t=>t.id!==xid);saveStorage();}render();return;}
  if(action==='doDeleteAsset'){const xid=S.confirmPending?.id;S.confirmPending=null;if(xid){S.assets=S.assets.filter(a=>a.id!==xid);saveStorage();}render();return;}

  if(action==='saveLoan'){
    const f=getF();
    const tool=S.tools.find(t=>t.id===f.toolId);
    if(!tool){alert('Pilih alat terlebih dahulu');return;}
    if(!f.borrower||!f.date||!f.dueDate||!f.qty){alert('Lengkapi semua field wajib (*)');return;}
    const q=Number(f.qty);
    if(q>tool.available){alert('Stok tidak mencukupi (tersedia: '+tool.available+')');return;}
    const loan={id:uid(),toolId:tool.id,toolName:tool.name,code:tool.code||'',borrower:f.borrower,dept:f.dept||'',phone:f.phone||'',date:f.date,dueDate:f.dueDate,qty:q,purpose:f.purpose||'',conditionOut:f.conditionOut||'Baik',status:'active',returnDate:null,conditionIn:null,returnNotes:'',notes:f.notes||''};
    S.loans.push(loan);
    S.tools=S.tools.map(t=>t.id===tool.id?{...t,available:t.available-q}:t);
    S.modal=null;S.form={};saveStorage();render();
    setTimeout(()=>printLoan(loan),300);return;
  }

  if(action==='saveReturn'){
    const f=getF();
    if(!f.conditionIn||!f.returnDate){alert('Isi kondisi dan tanggal pengembalian');return;}
    const loan=S.loans.find(l=>l.id===S.selId);
    if(!loan)return;
    const updated={...loan,status:'returned',returnDate:f.returnDate,conditionIn:f.conditionIn,returnNotes:f.returnNotes||''};
    S.loans=S.loans.map(l=>l.id===S.selId?updated:l);
    S.tools=S.tools.map(t=>t.id===loan.toolId?{...t,available:t.available+loan.qty,condition:f.conditionIn}:t);
    S.modal=null;S.form={};S.selId=null;saveStorage();render();
    setTimeout(()=>printReturn(updated),300);return;
  }

  if(action==='saveAsset'){
    const f=getF();
    if(!f.name||!f.purchaseDate||!f.purchasePrice){alert('Lengkapi field wajib (*)');return;}
    S.assets.push({id:uid(),name:f.name,code:f.code||'',category:f.category||'Furnitur',purchaseDate:f.purchaseDate,purchasePrice:Number(f.purchasePrice),lifespan:Number(f.lifespan)||5,condition:f.condition||'Baik',location:f.location||'',serial:f.serial||'',status:f.status||'Aktif',desc:f.desc||''});
    S.modal=null;S.form={};saveStorage();render();return;
  }

  if(action==='saveEditAsset'){
    const f=getF();
    S.assets=S.assets.map(a=>a.id===S.selId?{...a,condition:f.condition||a.condition,status:f.status||a.status,location:f.location!=null?f.location:a.location,desc:f.desc!=null?f.desc:a.desc}:a);
    S.modal=null;S.form={};S.selId=null;saveStorage();render();return;
  }

  if(action==='saveMaint'){
    const f=getF();
    if(!f.date||!f.type){alert('Lengkapi tanggal dan jenis perawatan');return;}
    const asset=S.assets.find(a=>a.id===S.selId)||{};
    S.maint.push({id:uid(),assetId:S.selId,assetName:asset.name||'',date:f.date,type:f.type,cost:Number(f.cost)||0,desc:f.desc||'',tech:f.tech||''});
    S.modal=null;S.form={};S.selId=null;saveStorage();render();return;
  }
});
